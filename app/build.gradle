plugins { id 'com.android.application' }
android {
 namespace 'com.neko.subvoz'
 compileSdk 35
 defaultConfig { applicationId 'com.neko.subvoz'; minSdk 29; targetSdk 32; versionCode 2; versionName '0.2' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
 implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
 implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
 // GPLv3 MP3 encoder; exclude its obsolete support-v7 stack (the app uses AndroidX).
 implementation('com.github.naman14:TAndroidLame:1.1') { exclude group: 'com.android.support', module: 'appcompat-v7' }
}
